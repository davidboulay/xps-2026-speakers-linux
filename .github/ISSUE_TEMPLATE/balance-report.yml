name: Balance report
description: Share the left/right setting that sounds centred on your XPS, so the defaults can be based on more than one unit.
title: "Balance report: <model> <spkid> <value> dB"
labels: ["balance-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! The XPS 14 default (right side down 6.6 dB) was measured by ear on a single unit with `spkid0` speakers. Reports from other units, other speaker builds and the XPS 16 tell us whether it holds.
  - type: dropdown
    id: model
    attributes:
      label: Model
      options: ["XPS 14 DA14260 (0DB9)", "XPS 16 DA16260 (0DBA)", "Other"]
    validations: { required: true }
  - type: textarea
    id: speaker-id
    attributes:
      label: Output of `sudo ~/.local/bin/xps-speaker-id`
      render: text
    validations: { required: true }
  - type: input
    id: value
    attributes:
      label: Your centred setting (`speaker-balance` with no argument)
      placeholder: "balance: right side down 6.6 dB"
    validations: { required: true }
  - type: dropdown
    id: confidence
    attributes:
      label: How sure are you?
      options: ["Clear: tried values on both sides of it", "Rough: sounds about right"]
  - type: input
    id: setup
    attributes:
      label: Distro, kernel, BIOS version
      placeholder: "CachyOS, 7.3.1, BIOS 1.10.1"
